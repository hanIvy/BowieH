<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Tree</title>

<!-- ============================================================
     STYLE
     All visual rules live here. Colors are defined once as CSS
     variables at the top (--bg, --ink, --accent, --line) so the
     whole palette can be changed by editing a handful of lines.
     ============================================================ -->
<style>
  :root {
    --bg: #f6f4ef;          /* page background, warm off-white */
    --ink: #242220;         /* main text color, near-black */
    --ink-soft: rgba(36,34,32,0.55);
    --ink-faint: rgba(36,34,32,0.35);
    --accent: #3f6f66;      /* single accent color used for state */
    --accent-dark: #2d514a;
    --accent-soft: rgba(63,111,102,0.18);
    --line: rgba(36,34,32,0.20);   /* connection lines between nodes */
    --panel-bg: #fffdf9;
    --panel-shadow: 0 8px 30px rgba(36,34,32,0.18);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100%;
    overflow: hidden; /* the canvas area scrolls internally, page itself doesn't */
  }

  /* ---------- Toolbar ---------- */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, var(--bg) 70%, transparent);
  }

  #toolbar h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }

  #toolbar .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button, .file-btn {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--panel-bg);
    border: 1px solid var(--ink-faint);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button:hover, .file-btn:hover {
    border-color: var(--ink-soft);
    background: #fff;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.danger {
    color: #8a3b2f;
    border-color: rgba(138,59,47,0.4);
  }
  button.danger:hover { background: rgba(138,59,47,0.08); }

  input[type="file"] { display: none; }

  /* ---------- Legend ---------- */
  #legend {
    position: fixed;
    top: 56px; left: 28px;
    z-index: 20;
    font-size: 11.5px;
    color: var(--ink-soft);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    max-width: 90%;
  }
  #legend .group { display: flex; align-items: center; gap: 10px; }
  #legend .swatch { display: inline-flex; align-items: center; gap: 4px; }
  #legend svg { display: block; }

  /* ---------- Canvas (the scrollable map area) ---------- */
  #canvasWrap {
    position: absolute;
    inset: 0;
    overflow: auto;
    padding-top: 90px; /* room for toolbar/legend */
  }

  #canvas {
    position: relative;
    width: 2400px;
    height: 1500px;
  }

  #edgeLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* clicks pass through to nodes */
  }

  /* ---------- Nodes ---------- */
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transform: translate(-50%, -50%);
    cursor: grab;
    user-select: none;
    touch-action: none;
    width: 110px;
  }
  .node:active { cursor: grabbing; }

  .node-shape-svg { display: block; overflow: visible; }

  .node-label {
    font-size: 12px;
    line-height: 1.25;
    text-align: center;
    color: var(--ink);
    max-width: 100px;
  }

  /* Shape base style, state is applied via fill/stroke/opacity below */
  .node-shape {
    stroke-width: 1.6;
  }
  .state-not_started .node-shape {
    fill: var(--bg);
    stroke: var(--ink-faint);
    stroke-dasharray: 3 3;
    opacity: 0.75;
  }
  .state-in_progress .node-shape {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-dasharray: none;
    opacity: 0.95;
  }
  .state-completed .node-shape {
    fill: var(--accent);
    stroke: var(--accent-dark);
    stroke-dasharray: none;
    opacity: 1;
  }
  .state-not_started .node-label { opacity: 0.6; }

  /* ---------- Modal (shared overlay for detail + add/edit forms) ---------- */
  #modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(36,34,32,0.28);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #modalOverlay.open { display: flex; }

  #modalBox {
    background: var(--panel-bg);
    border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    width: 360px;
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 60px);
    overflow-y: auto;
    padding: 22px;
  }

  #modalBox h2 {
    margin: 0 0 4px;
    font-size: 16px;
  }
  #modalBox .category-tag {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input[type="text"],
  .field select {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--ink-faint);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }

  .connections-list {
    max-height: 130px;
    overflow-y: auto;
    border: 1px solid var(--ink-faint);
    border-radius: 6px;
    padding: 6px 9px;
    background: #fff;
  }
  .connections-list label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--ink);
    padding: 3px 0;
    cursor: pointer;
  }
  .connections-list .empty-note {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .modal-actions button { flex: 1; }

  .modal-close-x {
    float: right;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0 2px;
  }
  .modal-close-x:hover { color: var(--ink); }
</style>
</head>
<body>

  <!-- ============================================================
       TOOLBAR — title + global actions
       ============================================================ -->
  <div id="toolbar">
    <h1>Skill Tree</h1>
    <div class="actions">
      <button id="btnAdd" class="primary">+ Add</button>
      <button id="btnExport">Export</button>
      <label class="file-btn" for="importFile">Import</label>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

  <!-- Small always-visible key explaining shapes/states, so the map
       doesn't need labels or badges on every node. -->
  <div id="legend">
    <div class="group" id="legendCategories"></div>
    <div class="group" id="legendStates"></div>
  </div>

  <!-- ============================================================
       CANVAS — the map itself. #edgeLayer draws connection lines,
       nodes are absolutely-positioned divs added on top by JS.
       ============================================================ -->
  <div id="canvasWrap">
    <div id="canvas">
      <svg id="edgeLayer"></svg>
      <!-- node elements are injected here by render() -->
    </div>
  </div>

  <!-- ============================================================
       MODAL — one shared popup used for both "view/edit node" and
       "add new node". Its inner content is swapped by JS depending
       on what the user clicked.
       ============================================================ -->
  <div id="modalOverlay">
    <div id="modalBox"></div>
  </div>

<script>
/* ==================================================================
   SECTION 1: DATA
   Everything about reading/writing the tree's data. The data is one
   object: { nodes: [ ... ] }. Each node looks like:
     {
       id: "unique string",
       name: "Human readable name",
       category: "Skill" | "Project" | "Tool Experiment" | "Hobby",
       state: "not_started" | "in_progress" | "completed",
       connections: ["id-of-related-node", ...],
       x: 400, y: 250   // position on the canvas, in pixels
     }
   It is kept in the browser's localStorage as JSON, under one key,
   so it survives closing/reopening this file.
   ================================================================== */

const STORAGE_KEY = "skillTreeData";
const CATEGORIES = ["Skill", "Project", "Tool Experiment", "Hobby"];
const STATES = ["not_started", "in_progress", "completed"];
const STATE_LABELS = { not_started: "Not Started", in_progress: "In Progress", completed: "Completed" };

// A small starter tree so the app isn't empty on first open.
// Delete these or Import your own file to replace them at any time.
function seedData() {
  const v = uid(), h = uid(), j = uid(), app = uid(), fig = uid(), art = uid();
  return {
    nodes: [
      { id: v,   name: "Visual Design",          category: "Skill",          state: "completed",   connections: [] },
      { id: h,   name: "HTML & CSS",              category: "Skill",          state: "in_progress", connections: [v] },
      { id: j,   name: "JavaScript Basics",       category: "Skill",          state: "not_started", connections: [h] },
      { id: app, name: "This Skill Tree App",     category: "Project",        state: "in_progress", connections: [h, j] },
      { id: fig, name: "Prototyping in Figma",    category: "Tool Experiment",state: "completed",   connections: [v] },
      { id: art, name: "Generative Art Doodles",  category: "Hobby",          state: "not_started", connections: [j] },
    ]
  };
}

function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
}

let store = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seedData();
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.nodes)) return seedData();
    return parsed;
  } catch (e) {
    console.warn("Could not read saved data, starting fresh.", e);
    return seedData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

function getNode(id) {
  return store.nodes.find(n => n.id === id);
}

// Removes a node and cleans up any other node's connections that pointed to it.
function deleteNode(id) {
  store.nodes = store.nodes.filter(n => n.id !== id);
  store.nodes.forEach(n => { n.connections = n.connections.filter(cid => cid !== id); });
  saveData();
}


/* ==================================================================
   SECTION 2: EXPORT / IMPORT
   Lets you save the tree as a .json file (e.g. to back it up or bulk
   edit in a text editor) and load one back in, replacing current data.
   ================================================================== */

document.getElementById("btnExport").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `skill-tree-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.nodes)) throw new Error("File is missing a 'nodes' list.");
      // Light validation/cleanup so a hand-edited file can't break the app.
      parsed.nodes.forEach(n => {
        if (!n.id) n.id = uid();
        if (!CATEGORIES.includes(n.category)) n.category = "Skill";
        if (!STATES.includes(n.state)) n.state = "not_started";
        if (!Array.isArray(n.connections)) n.connections = [];
      });
      store = { nodes: parsed.nodes };
      saveData();
      layoutMissingPositions();
      render();
    } catch (err) {
      alert("Could not import this file: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ""; // allow re-importing the same filename later
});


/* ==================================================================
   SECTION 3: AUTO-LAYOUT
   Runs once when a node has no saved x/y (new node, or a freshly
   imported file). It's a simple physics simulation: nodes push each
   other apart, connected nodes pull toward each other, repeated for
   a fixed number of steps until it settles into a readable layout.
   Dragging a node afterward just overwrites its saved x/y directly.
   ================================================================== */

function layoutMissingPositions() {
  const needsLayout = store.nodes.filter(n => typeof n.x !== "number" || typeof n.y !== "number");
  if (needsLayout.length === 0) return;

  const centerX = 1200, centerY = 750;

  // Start unplaced nodes in a rough circle around the center.
  needsLayout.forEach((n, i) => {
    const angle = (i / needsLayout.length) * Math.PI * 2;
    n.x = centerX + Math.cos(angle) * 260;
    n.y = centerY + Math.sin(angle) * 260;
  });

  const REPEL = 26000;      // how strongly nodes push apart
  const SPRING_LEN = 210;   // preferred distance along a connection
  const SPRING_K = 0.02;    // how strongly connections pull together
  const STEPS = 260;

  for (let step = 0; step < STEPS; step++) {
    const forces = new Map(store.nodes.map(n => [n.id, { fx: 0, fy: 0 }]));

    // Repulsion: every pair of nodes pushes apart (keeps things from overlapping).
    for (let i = 0; i < store.nodes.length; i++) {
      for (let j = i + 1; j < store.nodes.length; j++) {
        const a = store.nodes[i], b = store.nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let distSq = dx * dx + dy * dy || 0.01;
        const force = REPEL / distSq;
        const dist = Math.sqrt(distSq);
        const fx = (dx / dist) * force, fy = (dy / dist) * force;
        forces.get(a.id).fx += fx; forces.get(a.id).fy += fy;
        forces.get(b.id).fx -= fx; forces.get(b.id).fy -= fy;
      }
    }

    // Attraction: connected nodes pull toward a comfortable distance apart.
    store.nodes.forEach(n => {
      n.connections.forEach(cid => {
        const other = getNode(cid);
        if (!other) return;
        const dx = other.x - n.x, dy = other.y - n.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const stretch = dist - SPRING_LEN;
        const fx = (dx / dist) * stretch * SPRING_K, fy = (dy / dist) * stretch * SPRING_K;
        forces.get(n.id).fx += fx; forces.get(n.id).fy += fy;
      });
    });

    // Only move the nodes that actually needed placing; keep user-positioned ones fixed.
    needsLayout.forEach(n => {
      const f = forces.get(n.id);
      n.x += Math.max(-12, Math.min(12, f.fx)) ;
      n.y += Math.max(-12, Math.min(12, f.fy));
      n.x = Math.max(80, Math.min(2320, n.x));
      n.y = Math.max(80, Math.min(1420, n.y));
    });
  }

  saveData();
}


/* ==================================================================
   SECTION 4: RENDER
   Draws every node and connection line based on the current `store`.
   Called after any change to the data (add/edit/delete/import/drag).
   ================================================================== */

const canvas = document.getElementById("canvas");
const edgeLayer = document.getElementById("edgeLayer");
const NODE_RADIUS = 24;

function render() {
  // Clear previous nodes (keep the svg edge layer, redraw it separately).
  canvas.querySelectorAll(".node").forEach(el => el.remove());
  edgeLayer.innerHTML = "";
  edgeLayer.setAttribute("width", canvas.offsetWidth);
  edgeLayer.setAttribute("height", canvas.offsetHeight);

  // --- draw connection lines first, so nodes sit visually on top ---
  const drawnPairs = new Set();
  store.nodes.forEach(n => {
    n.connections.forEach(cid => {
      const other = getNode(cid);
      if (!other) return;
      const pairKey = [n.id, cid].sort().join("|");
      if (drawnPairs.has(pairKey)) return; // avoid drawing the same line twice
      drawnPairs.add(pairKey);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", n.x);
      line.setAttribute("y1", n.y);
      line.setAttribute("x2", other.x);
      line.setAttribute("y2", other.y);
      line.setAttribute("stroke", "var(--line)");
      line.setAttribute("stroke-width", "1.4");
      line.id = "edge-" + pairKey;
      edgeLayer.appendChild(line);
    });
  });

  // --- draw nodes ---
  store.nodes.forEach(n => {
    canvas.appendChild(buildNodeElement(n));
  });
}

function buildNodeElement(n) {
  const el = document.createElement("div");
  el.className = `node state-${n.state}`;
  el.style.left = n.x + "px";
  el.style.top = n.y + "px";
  el.dataset.id = n.id;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", 56);
  svg.setAttribute("height", 56);
  svg.classList.add("node-shape-svg");

  const shape = shapeElement(n.category, 28, 28, NODE_RADIUS);
  shape.classList.add("node-shape");
  svg.appendChild(shape);

  const label = document.createElement("div");
  label.className = "node-label";
  label.textContent = n.name;

  el.appendChild(svg);
  el.appendChild(label);

  attachNodeInteractions(el, n.id);
  return el;
}

// Returns the right SVG shape for a category, centered at (cx, cy).
// This is the ONE place that maps category -> shape, so adding a new
// category later just means adding a case here and to CATEGORIES above.
function shapeElement(category, cx, cy, r) {
  const svgNS = "http://www.w3.org/2000/svg";
  if (category === "Skill") {
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
    return c;
  }
  if (category === "Project") {
    const side = r * 1.6;
    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", cx - side / 2);
    rect.setAttribute("y", cy - side / 2);
    rect.setAttribute("width", side);
    rect.setAttribute("height", side);
    rect.setAttribute("rx", 4);
    return rect;
  }
  if (category === "Tool Experiment") {
    const d = r * 0.95;
    const points = [[cx, cy - d], [cx + d, cy], [cx, cy + d], [cx - d, cy]]
      .map(p => p.join(",")).join(" ");
    const poly = document.createElementNS(svgNS, "polygon");
    poly.setAttribute("points", points);
    return poly;
  }
  // Hobby -> triangle
  const d = r * 1.05;
  const points = [
    [cx, cy - d],
    [cx + d * 0.95, cy + d * 0.75],
    [cx - d * 0.95, cy + d * 0.75],
  ].map(p => p.join(",")).join(" ");
  const tri = document.createElementNS(svgNS, "polygon");
  tri.setAttribute("points", points);
  return tri;
}


/* ==================================================================
   SECTION 5: DRAG + CLICK
   Pointer-down starts tracking; if the pointer moves more than a few
   pixels before release, it's treated as a drag (reposition + save).
   Otherwise it's treated as a click (open the detail modal).
   ================================================================== */

function attachNodeInteractions(el, nodeId) {
  let dragging = false;
  let startX = 0, startY = 0;
  let nodeStartX = 0, nodeStartY = 0;

  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const n = getNode(nodeId);
    dragging = false;
    startX = e.clientX; startY = e.clientY;
    nodeStartX = n.x; nodeStartY = n.y;
    el.setPointerCapture(e.pointerId);

    function onMove(ev) {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 4) dragging = true;
      if (dragging) {
        n.x = nodeStartX + dx;
        n.y = nodeStartY + dy;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
        updateEdgesFor(nodeId);
      }
    }
    function onUp() {
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      if (dragging) {
        saveData();
      } else {
        openDetailModal(nodeId);
      }
    }
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
  });
}

// While dragging, only reposition the lines touching the moved node
// (cheaper than re-rendering everything on every pointer move).
function updateEdgesFor(nodeId) {
  const n = getNode(nodeId);
  n.connections.forEach(cid => {
    const pairKey = [nodeId, cid].sort().join("|");
    const line = document.getElementById("edge-" + pairKey);
    if (!line) return;
    if (line.getAttribute("x1") == getNode(cid).x && line.getAttribute("y1") == getNode(cid).y) {
      line.setAttribute("x2", n.x); line.setAttribute("y2", n.y);
    } else {
      line.setAttribute("x1", n.x); line.setAttribute("y1", n.y);
    }
  });
  // Also catch edges where this node is the "other" side.
  store.nodes.forEach(other => {
    if (other.connections.includes(nodeId)) {
      const pairKey = [other.id, nodeId].sort().join("|");
      const line = document.getElementById("edge-" + pairKey);
      if (!line) return;
      const otherIsFirst = line.getAttribute("x1") == other.x && line.getAttribute("y1") == other.y;
      if (otherIsFirst) { line.setAttribute("x2", n.x); line.setAttribute("y2", n.y); }
      else { line.setAttribute("x1", n.x); line.setAttribute("y1", n.y); }
    }
  });
}


/* ==================================================================
   SECTION 6: MODAL — detail / edit / add
   One overlay is reused for everything. openDetailModal shows a
   read view with "cycle state / edit / delete". Edit re-uses the
   same form as "+ Add".
   ================================================================== */

const modalOverlay = document.getElementById("modalOverlay");
const modalBox = document.getElementById("modalBox");

function closeModal() {
  modalOverlay.classList.remove("open");
  modalBox.innerHTML = "";
}

modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

function openDetailModal(nodeId) {
  const n = getNode(nodeId);
  if (!n) return;

  const connectedNames = n.connections
    .map(cid => getNode(cid))
    .filter(Boolean)
    .map(o => o.name);

  modalBox.innerHTML = `
    <button class="modal-close-x" id="mClose">✕</button>
    <h2>${escapeHtml(n.name)}</h2>
    <div class="category-tag">${n.category} · ${STATE_LABELS[n.state]}</div>
    <div class="field">
      <label>Connected to</label>
      <div>${connectedNames.length ? escapeHtml(connectedNames.join(", ")) : "<span style='color:var(--ink-faint)'>Nothing yet</span>"}</div>
    </div>
    <div class="modal-actions">
      <button id="mCycle" class="primary">${nextStateLabel(n.state)}</button>
    </div>
    <div class="modal-actions">
      <button id="mEdit">Edit</button>
      <button id="mDelete" class="danger">Delete</button>
    </div>
  `;
  modalOverlay.classList.add("open");

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCycle").addEventListener("click", () => {
    n.state = nextState(n.state);
    saveData();
    render();
    openDetailModal(nodeId); // refresh modal contents in place
  });
  document.getElementById("mEdit").addEventListener("click", () => openFormModal(nodeId));
  document.getElementById("mDelete").addEventListener("click", () => {
    if (confirm(`Delete "${n.name}"? This can't be undone.`)) {
      deleteNode(nodeId);
      closeModal();
      render();
    }
  });
}

function nextState(state) {
  const i = STATES.indexOf(state);
  return STATES[(i + 1) % STATES.length];
}
function nextStateLabel(state) {
  return "Mark as " + STATE_LABELS[nextState(state)];
}

// nodeId is null for "add new", or an existing id for "edit".
function openFormModal(nodeId) {
  const editing = nodeId ? getNode(nodeId) : null;
  const title = editing ? "Edit node" : "Add node";

  const categoryOptions = CATEGORIES.map(c =>
    `<option value="${c}" ${editing && editing.category === c ? "selected" : ""}>${c}</option>`
  ).join("");

  const stateOptions = STATES.map(s =>
    `<option value="${s}" ${editing && editing.state === s ? "selected" : ""}>${STATE_LABELS[s]}</option>`
  ).join("");

  const otherNodes = store.nodes.filter(n => !editing || n.id !== editing.id);
  const connectionCheckboxes = otherNodes.length
    ? otherNodes.map(n => {
        const checked = editing && editing.connections.includes(n.id) ? "checked" : "";
        return `<label><input type="checkbox" value="${n.id}" ${checked}> ${escapeHtml(n.name)}</label>`;
      }).join("")
    : `<div class="empty-note">No other nodes yet to connect to.</div>`;

  modalBox.innerHTML = `
    <button class="modal-close-x" id="mClose">✕</button>
    <h2>${title}</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="fName" value="${editing ? escapeHtml(editing.name) : ""}" placeholder="e.g. Watercolor Painting">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="fCategory">${categoryOptions}</select>
    </div>
    <div class="field">
      <label>State</label>
      <select id="fState">${stateOptions}</select>
    </div>
    <div class="field">
      <label>Connect to</label>
      <div class="connections-list">${connectionCheckboxes}</div>
    </div>
    <div class="modal-actions">
      <button id="fCancel">Cancel</button>
      <button id="fSave" class="primary">Save</button>
    </div>
  `;
  modalOverlay.classList.add("open");

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("fCancel").addEventListener("click", closeModal);
  document.getElementById("fSave").addEventListener("click", () => {
    const name = document.getElementById("fName").value.trim();
    if (!name) { alert("Please give it a name."); return; }
    const category = document.getElementById("fCategory").value;
    const state = document.getElementById("fState").value;
    const connections = Array.from(modalBox.querySelectorAll(".connections-list input:checked")).map(cb => cb.value);

    if (editing) {
      editing.name = name;
      editing.category = category;
      editing.state = state;
      editing.connections = connections;
    } else {
      store.nodes.push({ id: uid(), name, category, state, connections });
      layoutMissingPositions();
    }
    saveData();
    closeModal();
    render();
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("btnAdd").addEventListener("click", () => openFormModal(null));


/* ==================================================================
   SECTION 7: LEGEND
   Builds the small shape/state key shown under the toolbar.
   ================================================================== */

function buildLegend() {
  const catBox = document.getElementById("legendCategories");
  CATEGORIES.forEach(cat => {
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", 16); svg.setAttribute("height", 16);
    const shape = shapeElement(cat, 8, 8, 6);
    shape.setAttribute("fill", "none");
    shape.setAttribute("stroke", "var(--ink-soft)");
    shape.setAttribute("stroke-width", "1.4");
    svg.appendChild(shape);

    const wrap = document.createElement("span");
    wrap.className = "swatch";
    wrap.appendChild(svg);
    wrap.appendChild(document.createTextNode(cat));
    catBox.appendChild(wrap);
  });

  const stateBox = document.getElementById("legendStates");
  stateBox.textContent = "hollow = not started  ·  tinted = in progress  ·  solid = completed";
}


/* ==================================================================
   SECTION 8: INIT
   Runs once when the page loads: lay out any un-positioned nodes,
   build the legend, and draw everything.
   ================================================================== */

layoutMissingPositions();
buildLegend();
render();
centerViewOnNodes();

// Redraw edge line coordinates if the window resizes (canvas itself
// is a fixed virtual size, so this mainly keeps the svg viewport right).
window.addEventListener("resize", render);

// Scrolls the canvas so the middle of the tree starts in view, since the
// canvas is much bigger than the window and (0,0) would otherwise show
// an empty corner instead of the actual nodes.
function centerViewOnNodes() {
  if (store.nodes.length === 0) return;
  const xs = store.nodes.map(n => n.x), ys = store.nodes.map(n => n.y);
  const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const midY = (Math.min(...ys) + Math.max(...ys)) / 2;
  const wrap = document.getElementById("canvasWrap");
  wrap.scrollLeft = Math.max(0, midX - wrap.clientWidth / 2);
  wrap.scrollTop = Math.max(0, midY - wrap.clientHeight / 2);
}
</script>
</body>
